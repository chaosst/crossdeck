<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>crossdeck · Web</title>
    <!--
      这里只有挂载点。界面的全部样式来自 `@crossdeck/ui/src/styles.css`（由入口脚本
      import），页面本身不写一行 UI 样式 —— 写在这里就等于给「三端同一份界面」
      开一个只在 Web 生效的口子。
    -->
    <style>
      /* 首帧前的一层底色：脚本加载完之前不闪白。与三端同一个 canvas 色。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f5f2;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
