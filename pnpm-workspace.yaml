packages:
  - 'packages/*'

# 依赖安装脚本白名单。
#
# 两条实测结论支撑"全部不放行"：
#   1. **electron 44 起不再有 postinstall**（package.json 里已无 scripts 字段）。
#      二进制改成显式拉取，pnpm 的构建白名单对它毫无作用：
#      见 `pnpm setup:electron`。
#   2. **esbuild 的 postinstall 只做二进制版本校验**，
#      真正的平台二进制由 optionalDependencies（@esbuild/win32-x64）提供。
#      不放行它，esbuild 的 build / transform 依然可用 —— 已实测验证。
#
# 注意必须写成 false，不能省略：
#   pnpm 11 会把"未表态"的条目重写成占位符
#   （`esbuild: set this to true or false`），并把存在被忽略的构建脚本当作错误退出。
#   显式 false = 我已决策不放行，pnpm 才停止报错。
#
# 副作用是供应链攻击面更小：装的依赖里没有任何一个会在安装时执行脚本。
#
# electron-winstaller 随 electron-builder 一起进来，是 **Squirrel.Windows** 的后端。
# 本项目 Win 目标用 NSIS（见 electron-builder.yml），走不到它 —— 不放行，
# 它也就不会在安装时往仓库里写任何东西。
allowBuilds:
  electron-winstaller: false
  esbuild: false

# 版本覆盖。
#
# ## app-builder-lib > @electron/get 必须钉在 3.1.0
#
# 症状：`pnpm pack:win` 在 packaging 阶段炸掉 ——
#   ⨯ Cannot read properties of undefined (reading 'ReadWrite')
#     at resolveCacheMode (app-builder-lib/out/util/electronGet.js:69)
# 即 `require("@electron/get").ElectronDownloadCacheMode` 拿到 undefined。
#
# 根因（对照实验，同一份 package.json，只换 registry）：
#   registry.npmjs.org      @electron/get@^3.0.0 -> 3.1.0   ✅ 符合 semver
#   registry.npmmirror.com  @electron/get@^3.0.0 -> 3.0.0   ❌ 挑低了
# 这不是 electron-builder 的问题：它声明 `"@electron/get": "^3.0.0"`，
# 而 **ElectronDownloadCacheMode 恰好是 3.1.0 才新增的导出**
# （3.1.0 的 dist/cjs/index.js 末尾 `__exportStar(require("./types"), exports)`；
#  实测下载两份包体确认：3.0.0 无此导出、3.1.0 有、4.0.0 起转为纯 ESM 不适合 require）。
# 也就是说：上游的依赖范围本身就是对的，是**镜像的挑版行为不符合 semver**，
# 把 app-builder-lib 喂到了缺枚举的 3.0.0。
#
# 为什么用 `<父包>><子包>` 这种带父级的写法，而不是全局覆盖：
#   electron@44 自己依赖 @electron/get@^5.1.0（ESM），全局钉 3.1.0 会把它砸坏。
#   带父级 = 只改 app-builder-lib 这一条边，改动面最小。
#
# 钉精确版本而非 `^3.1.0`：镜像连 `^3.0.0` 都挑错，不给它再挑一次的机会。
overrides:
  'app-builder-lib>@electron/get': 3.1.0
